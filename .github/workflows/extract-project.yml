name: Extract Debt Freedom AI

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No project ZIP found."
            exit 1
          fi

          rm -rf extracted-project
          mkdir extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          cp -a extracted-project/. .

          rm -rf extracted-project
          rm -f "$ZIP_FILE"

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Extract Debt Freedom AI project"
          git push
